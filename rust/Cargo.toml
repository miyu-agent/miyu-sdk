[package]
name = "miyu-ext"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Write a Miyu extension in Rust: handshake, line-by-line JSON-RPC, concurrent calls, cancelling and config pushes."
publish = false

[dependencies]
# One compact JSON-RPC message per line (the core repository's docs/reference/extensions.md).
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_docs = "warn"

[lints.clippy]
let_underscore_must_use = "deny"
unused_result_ok = "deny"
unwrap_used = "deny"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
